<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amaka's Premium Fits | Studio Index</title>

    <!-- Tailwind CSS (used for the rest of the body) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout Utilities */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Premium Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastSlideDown {
            0% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            90% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }

        .animate-fade-up {
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .toast-animate {
            animation: toastSlideDown 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Cart Drawer Transitions */
        #cart-drawer {
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #cart-overlay {
            transition: opacity 0.4s ease;
        }

        .drawer-open {
            transform: translateX(0);
        }

        .drawer-closed {
            transform: translateX(100%);
        }

        .overlay-open {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-closed {
            opacity: 0;
            pointer-events: none;
        }

        /* ========================================== */
        /* STANDARD CSS FOR PLATFORM HEADER          */
        /* ========================================== */
        .platform-header {
            flex: none;
            z-index: 40;
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(38, 38, 38, 0.6);
        }

        .header-container {
            max-width: 56rem;
            /* 896px / max-w-4xl */
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
            height: 4rem;
            /* 64px / h-16 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            /* 10px / gap-2.5 */
            color: #a3a3a3;
            /* neutral-400 */
            cursor: pointer;
            transition: color 0.15s ease-in-out;
        }

        .header-brand:hover {
            color: #f5f5f5;
            /* neutral-100 */
        }

        .header-icon {
            font-size: 1.25rem;
            /* 20px / text-xl */
            transition: color 0.5s ease;
        }

        .header-brand:hover .header-icon {
            color: #fbbf24;
            /* amber-400 */
        }

        .header-title {
            font-size: 0.75rem;
            /* 12px / text-xs */
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="bg-neutral-950 text-neutral-100 h-screen flex flex-col overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] pointer-events-none hidden">
        <div
            class="bg-emerald-600/90 backdrop-blur-md text-white px-5 py-3 rounded-full shadow-[0_10px_40px_-10px_rgba(5,150,105,0.5)] flex items-center gap-3 border border-emerald-500/50">
            <i class="ph-fill ph-check-circle text-xl"></i>
            <span id="toast-message" class="text-sm font-medium tracking-wide">Added to cart</span>
        </div>
    </div>

    <!-- 1. Platform Header (Fixed Top) — CONVERTED TO STANDARD CSS -->
    <header class="platform-header">
        <div class="header-container">
            <div class="header-brand">
                <i class="ph-fill ph-diamonds-four header-icon"></i>
                <span class="header-title">Studio Index</span>
            </div>
        </div>
    </header>

    <!-- 2. Main Scrollable Content Area -->
    <main class="flex-grow overflow-y-auto no-scrollbar relative w-full pt-8 pb-32">
        <div class="max-w-4xl mx-auto px-4">

            <!-- Vendor Identity Block -->
            <section id="vendor-profile" class="flex flex-col items-center text-center mb-12 animate-fade-up">
                <!-- Loading Skeleton (Replaced by JS) -->
                <div class="w-24 h-24 rounded-full bg-neutral-900 animate-pulse mb-4"></div>
            </section>

            <!-- Product Catalog Grid -->
            <section>
                <div class="flex items-center justify-between mb-8 animate-fade-up" style="animation-delay: 100ms;">
                    <h2 class="text-xl font-medium text-neutral-200 flex items-center gap-3 tracking-tight">
                        <i class="ph ph-squares-four text-amber-400 text-2xl"></i> Collection
                    </h2>
                    <span id="product-count"
                        class="text-xs text-neutral-400 bg-neutral-900/50 px-3 py-1.5 rounded-full border border-neutral-800 backdrop-blur-sm">...</span>
                </div>

                <!-- Grid Container -->
                <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                    <!-- Products injected here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Floating Cart Button -->
    <button onclick="toggleCart()"
        class="fixed bottom-24 right-4 md:right-8 z-40 bg-amber-400 hover:bg-amber-300 text-neutral-950 p-4 rounded-full shadow-[0_10px_30px_-10px_rgba(251,191,36,0.4)] transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center group">
        <i class="ph-fill ph-shopping-cart-simple text-2xl group-hover:-rotate-12 transition-transform"></i>
        <!-- Cart Badge -->
        <span id="cart-badge"
            class="absolute -top-2 -right-2 bg-emerald-500 text-white text-[10px] font-bold h-6 w-6 flex items-center justify-center rounded-full border-2 border-neutral-950 scale-0 transition-transform duration-300">0</span>
    </button>

    <!-- 3. Footer CTA (Fixed Bottom) -->
    <footer class="flex-none border-t border-neutral-800/60 bg-neutral-950 z-40 relative">
        <div class="absolute inset-0 bg-gradient-to-t from-emerald-900/10 to-transparent pointer-events-none"></div>
        <div class="max-w-4xl mx-auto p-4 flex items-center justify-between gap-4 relative z-10">
            <div>
                <p class="text-[10px] md:text-xs text-neutral-500 uppercase tracking-wider font-semibold">Powered by</p>
                <p class="text-sm md:text-base text-neutral-200 font-bold tracking-tight">STUDIO INDEX</p>
            </div>
            <a href="#"
                class="px-5 py-2.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-200 text-xs md:text-sm font-semibold rounded-full transition-all flex items-center gap-2 active:scale-95 shadow-lg">
                Create yours <i class="ph-bold ph-arrow-up-right text-amber-400"></i>
            </a>
        </div>
    </footer>

    <!-- 4. Cart Slide-Out Drawer -->
    <div id="cart-overlay" onclick="toggleCart()"
        class="fixed inset-0 bg-neutral-950/60 backdrop-blur-sm z-[60] overlay-closed"></div>

    <div id="cart-drawer"
        class="fixed top-0 right-0 h-full w-full md:w-[420px] bg-neutral-900 border-l border-neutral-800 z-[70] shadow-2xl flex flex-col drawer-closed">
        <!-- Cart Header -->
        <div class="p-6 border-b border-neutral-800 flex items-center justify-between bg-neutral-950/50">
            <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                <i class="ph-fill ph-shopping-bag text-amber-400"></i> Your Cart
            </h2>
            <button onclick="toggleCart()"
                class="p-2 bg-neutral-800 rounded-full hover:bg-neutral-700 text-neutral-400 hover:text-white transition-colors">
                <i class="ph-bold ph-x"></i>
            </button>
        </div>

        <!-- Cart Items (Scrollable) -->
        <div id="cart-items" class="flex-grow overflow-y-auto no-scrollbar p-6 flex flex-col gap-4">
            <!-- Empty state default -->
            <div class="m-auto text-center text-neutral-500 flex flex-col items-center">
                <i class="ph-thin ph-shopping-cart text-6xl mb-4 opacity-50"></i>
                <p>Your cart is empty.</p>
            </div>
        </div>

        <!-- Cart Footer / Checkout -->
        <div class="p-6 border-t border-neutral-800 bg-neutral-950">
            <div class="flex items-center justify-between mb-6">
                <span class="text-neutral-400 font-medium">Total</span>
                <span id="cart-total" class="text-2xl font-bold text-white">₦0</span>
            </div>

            <button onclick="processCheckout()" id="checkout-btn"
                class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl transition-all shadow-[0_0_20px_rgba(5,150,105,0.3)] hover:shadow-[0_0_30px_rgba(5,150,105,0.5)] active:scale-95 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:shadow-none">
                <i class="ph-fill ph-whatsapp-logo text-xl"></i>
                Complete Order via WhatsApp
            </button>
        </div>
    </div>

    <!-- Vanilla JavaScript Engine -->
    <script>
        // --- 1. STATE & DATA ---
        let cart = [];

        const mockStoreData = {
            seller: {
                username: "amaka_wears",
                store_name: "Amaka's Premium Fits",
                whatsapp_number: "2348012345678",
                bio: "Curated luxury thrifts and premium streetwear. Delivery nationwide.",
                avatar_url: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=250&q=80"
            },
            products: [
                { id: "p1", name: "Vintage Denim Jacket", price: 15000, image_url: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?auto=format&fit=crop&w=500&q=80" },
                { id: "p2", name: "Nike Air Force 1", price: 45000, image_url: "https://images.unsplash.com/photo-1595950653106-6c9ebd614c3a?auto=format&fit=crop&w=500&q=80" },
                { id: "p3", name: "Emerald Silk Dress", price: 30000, image_url: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=500&q=80" },
                { id: "p4", name: "Gold Plated Watch", price: 25000, image_url: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=500&q=80" },
                { id: "p5", name: "Leather Tote Bag", price: 22000, image_url: "https://images.unsplash.com/photo-1584916201218-f4242ceb4809?auto=format&fit=crop&w=500&q=80" },
                { id: "p6", name: "Classic Sunglasses", price: 12000, image_url: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=500&q=80" }
            ]
        };

        // --- 2. UTILITY FUNCTIONS ---
        const formatNaira = (amount) => {
            return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', minimumFractionDigits: 0 }).format(amount);
        };

        const showToast = (message) => {
            const toast = document.getElementById('toast-container');
            document.getElementById('toast-message').textContent = message;

            // Reset animation
            toast.classList.remove('hidden', 'toast-animate');
            void toast.offsetWidth; // trigger reflow
            toast.classList.add('toast-animate');

            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        };

        // --- 3. CART LOGIC ---
        const addToCart = (productId) => {
            const product = mockStoreData.products.find(p => p.id === productId);
            if (!product) return;

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCartUI();
            showToast(`${product.name} added`);
        };

        const updateQty = (productId, delta) => {
            const item = cart.find(item => item.id === productId);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            updateCartUI();
        };

        const toggleCart = () => {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('cart-overlay');

            if (drawer.classList.contains('drawer-closed')) {
                drawer.classList.remove('drawer-closed');
                drawer.classList.add('drawer-open');
                overlay.classList.remove('overlay-closed');
                overlay.classList.add('overlay-open');
            } else {
                drawer.classList.remove('drawer-open');
                drawer.classList.add('drawer-closed');
                overlay.classList.remove('overlay-open');
                overlay.classList.add('overlay-closed');
            }
        };

        const updateCartUI = () => {
            // Update Floating Badge
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');

            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.classList.remove('scale-0');
                badge.classList.add('scale-100');
            } else {
                badge.classList.remove('scale-100');
                badge.classList.add('scale-0');
            }

            // Update Drawer Contents
            const cartContainer = document.getElementById('cart-items');
            const checkoutBtn = document.getElementById('checkout-btn');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="m-auto text-center text-neutral-500 flex flex-col items-center">
                        <i class="ph-thin ph-shopping-cart text-6xl mb-4 opacity-30"></i>
                        <p>Your cart is empty.</p>
                    </div>
                `;
                totalEl.textContent = '₦0';
                checkoutBtn.disabled = true;
                return;
            }

            checkoutBtn.disabled = false;
            let totalAmount = 0;

            cartContainer.innerHTML = cart.map(item => {
                totalAmount += (item.price * item.qty);
                return `
                    <div class="flex items-center gap-4 bg-neutral-950/50 p-3 rounded-2xl border border-neutral-800 relative overflow-hidden group">
                        <img src="${item.image_url}" class="w-16 h-16 rounded-xl object-cover border border-neutral-800">
                        <div class="flex-grow">
                            <h4 class="text-sm font-medium text-neutral-200 line-clamp-1">${item.name}</h4>
                            <p class="text-amber-400 text-sm font-semibold mt-0.5">${formatNaira(item.price)}</p>
                        </div>
                        
                        <!-- Qty Controls -->
                        <div class="flex items-center gap-3 bg-neutral-900 rounded-lg p-1 border border-neutral-800">
                            <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-md transition-colors">
                                <i class="ph-bold ${item.qty === 1 ? 'ph-trash text-red-400' : 'ph-minus'}"></i>
                            </button>
                            <span class="text-sm font-semibold w-3 text-center">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-md transition-colors">
                                <i class="ph-bold ph-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = formatNaira(totalAmount);
        };

        const processCheckout = () => {
            if (cart.length === 0) return;

            const store = mockStoreData.seller;
            let total = 0;

            let message = `Hi ${store.store_name},\n\nI am placing an order from your Studio Index store:\n\n`;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                message += `🛒 ${item.qty}x *${item.name}* - ${formatNaira(itemTotal)}\n`;
            });

            message += `\n💰 *Total Due: ${formatNaira(total)}*\n\nPlease let me know the payment details and delivery process.`;

            const waUrl = `https://wa.me/${store.whatsapp_number}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        };

        // --- 4. RENDER ENGINE ---
        const renderUI = () => {
            const seller = mockStoreData.seller;
            const products = mockStoreData.products;

            // Render Profile
            document.getElementById('vendor-profile').innerHTML = `
                <div class="relative mb-5 group">
                    <div class="absolute inset-0 bg-emerald-500 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-700"></div>
                    <img src="${seller.avatar_url}" alt="${seller.store_name}" class="relative w-24 h-24 md:w-28 md:h-28 rounded-full object-cover border-2 border-neutral-800 shadow-2xl z-10">
                    <div class="absolute bottom-0 right-0 bg-neutral-900 rounded-full p-1.5 border border-neutral-700 shadow-lg z-20" title="Verified Merchant">
                        <i class="ph-fill ph-check-circle text-emerald-500 text-xl"></i>
                    </div>
                </div>
                
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight mb-1">${seller.store_name}</h1>
                <p class="text-amber-400 text-sm font-semibold tracking-wide mb-4">@${seller.username}</p>
                <p class="text-neutral-400 text-sm max-w-md mx-auto leading-relaxed px-4">
                    ${seller.bio}
                </p>
            `;

            // Render Grid
            document.getElementById('product-count').textContent = `${products.length} Items`;

            document.getElementById('product-grid').innerHTML = products.map((product, index) => `
                <div class="group bg-neutral-900/40 rounded-2xl overflow-hidden border border-neutral-800/60 hover:border-neutral-700 hover:bg-neutral-900 transition-all duration-500 flex flex-col animate-fade-up shadow-lg hover:shadow-2xl hover:-translate-y-1 relative" style="animation-delay: ${(index + 2) * 100}ms">
                    
                    <div class="relative aspect-[4/5] overflow-hidden bg-neutral-950">
                        <img src="${product.image_url}" alt="${product.name}" loading="lazy" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-90 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-transparent to-transparent opacity-60"></div>
                        
                        <!-- Floating Price Tag -->
                        <div class="absolute top-3 left-3 bg-neutral-950/80 backdrop-blur-md border border-neutral-800 px-3 py-1.5 rounded-full text-amber-400 text-xs font-bold shadow-lg">
                            ${formatNaira(product.price)}
                        </div>
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow bg-gradient-to-b from-transparent to-neutral-950/50">
                        <h3 class="text-sm md:text-base font-medium text-neutral-100 mb-4 line-clamp-2 leading-snug">${product.name}</h3>
                        
                        <!-- Add to Cart Button -->
                        <button onclick="addToCart('${product.id}')" class="mt-auto w-full py-3 bg-neutral-100 hover:bg-white text-neutral-950 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.1)] group/btn">
                            <i class="ph-bold ph-plus text-lg transition-transform group-hover/btn:rotate-90"></i>
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderUI();
            updateCartUI(); // Set initial empty state
        });

    </script>
</body>

</html>
